name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (npm run verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with the builder image in the Dockerfile (node:22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright e2e is self-contained (contract server + vite preview, see
      # playwright.config.ts) and only needs Chromium (default project).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # format:check, lint, typecheck, vitest, build, playwright e2e.
      - name: npm run verify
        run: npm run verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Placeholder: the real value is only known at deploy time (see
      # deploy.yml). It only has to be a valid absolute URL.
      - name: Build image
        run: docker build --build-arg VITE_GATEWAY_BASE_URL=https://gateway.ci.invalid:8080 --tag front:ci-check .
